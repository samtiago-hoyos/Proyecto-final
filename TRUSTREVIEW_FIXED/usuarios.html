<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustReview - Comunidad</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="main-layout">
        <header class="section-header">
            <h2 class="section-title">Comunidad / Usuarios</h2>
        </header>

        <div class="user-list-grid">
            
            <div class="user-card">
                <img src="imagenes/user1.png" alt="Carlos_Cine" class="avatar-img">
                <div class="user-info">
                    <p class="username">Carlos_Cine</p>
                    <p class="user-status online">● Online</p>
                    <button class="btn-add-user">Agregar</button>
                </div>
            </div>

            <div class="user-card">
                <img src="imagenes/user2.png" alt="Ana_Review" class="avatar-img">
                <div class="user-info">
                    <p class="username">Ana_Review</p>
                    <p class="user-status online">● Online</p>
                    <button class="btn-add-user">Agregar</button>
                </div>
            </div>

            <div class="user-card">
                <img src="imagenes/user3.png" alt="Luis_Film" class="avatar-img">
                <div class="user-info">
                    <p class="username">Luis_Film</p>
                    <p class="user-status offline">○ Offline</p>
                    <button class="btn-add-user">Agregar</button>
                </div>
            </div>

            <div class="user-card">
                <img src="imagenes/user4.png" alt="Marta_Movies" class="avatar-img">
                <div class="user-info">
                    <p class="username">Marta_Movies</p>
                    <p class="user-status online">● Online</p>
                    <button class="btn-add-user">Agregar</button>
                </div>
            </div>

        </div> <div style="margin-top: 30px;">
            <a href="index.html" style="color: var(--accent-cyan); text-decoration: none;">← Volver al Inicio</a>
        </div>
    </div>

</body>
</html>
